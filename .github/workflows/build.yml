name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Pushing a commit to main and then tagging it fires two events.
# Same SHA shares one slot; the tag run cancels the branch run.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - id: decide
        uses: actions/github-script@v8
        with:
          script: |
            const isMainPush = context.eventName === 'push' && context.ref === 'refs/heads/main'
            if (!isMainPush) {
              core.setOutput('should_build', 'true')
              return
            }
            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'tags/v',
            })
            for (const r of refs) {
              let sha = r.object.sha
              if (r.object.type === 'tag') {
                const tag = await github.rest.git.getTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_sha: sha,
                })
                sha = tag.data.object.sha
              }
              if (sha === context.sha) {
                core.info(`Skip branch build; ${r.ref} already points at this commit`)
                core.setOutput('should_build', 'false')
                return
              }
            }
            core.setOutput('should_build', 'true')

  build:
    needs: decide
    if: needs.decide.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test bridge extension command handlers
        run: node --test tests/bridge-extension.test.mjs

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: pi-terminal-bridge
          path: build/distributions/*.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Pi Terminal Bridge ${{ github.ref_name }}
          files: build/distributions/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
